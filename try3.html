<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Forex Trading Sessions — Enhanced</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: black;
      }
      /* ===== MAIN CONTAINER ===== */
      .fx-widget {
        width: 100%;
        max-width: 1140px;
        margin: 0 auto;
        padding: 28px 25px 24px;
        background: #00091a;
        border: 1px solid #001331;
        border-radius: 12px;
        color: #f5f7fa;
        font-family: "DM Sans", sans-serif;
        box-sizing: border-box;
        overflow: hidden;
        position: relative;
      }
      .fx-widget * {
        box-sizing: border-box;
      }

      /* ===== HEADER ===== */
      .fx-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
      }
      .fx-header h2 {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 11px;
        font-size: 23px;
        font-weight: 700;
        color: #f5f7fa;
      }
      .fx-header h2 i {
        color: #00d99a;
      }
      .fx-clock {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 13px;
        background: #172337;
        border: 1px solid #2b3a50;
        border-radius: 30px;
        font-size: 12px;
        font-weight: 700;
        color: #9aa9bd;
      }
      .fx-clock i {
        color: #aab8ca;
      }
      .fx-separator {
        color: #53647c;
      }

      /* ===== MAP AREA ===== */
      .fx-map {
        position: relative;
        width: 100%;
        aspect-ratio: 1.89 / 1;
        margin: 20px auto 12px;
        isolation: isolate;
      }
      .fx-world-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: brightness(0) invert(1);
        opacity: 0.15;
        pointer-events: none;
      }

      /* ===== MAP MARKERS (default) ===== */
      .fx-marker {
        position: absolute;
        z-index: 2;
        display: flex;
        align-items: center;
        flex-direction: column;
        transform: translate(-50%, -50%);
        min-width: 60px;
        text-align: center;
        transition: 0.3s ease;
      }
      .fx-marker-name {
        color: #a5b3c6;
        font-size: 10px;
        font-weight: 700;
        white-space: nowrap;
        margin-bottom: 5px;
      }
      .fx-dot {
        display: block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #53647c;
        border: 1px solid #8796aa;
        position: relative;
        transition: 0.3s;
        flex-shrink: 0;
      }
      .fx-marker-time {
        font-size: 9px;
        color: #8494aa;
        margin-top: 4px;
        white-space: nowrap;
      }
      .fx-right {
        transform: translate(-75%, -50%);
      }

      /* ===== ACTIVE MARKET (BLINKING) ===== */
      .fx-marker.active .fx-marker-name,
      .fx-marker.active .fx-marker-time {
        color: #00e6a0;
      }

      .fx-marker.active .fx-dot {
        background: #00e6a0;
        border-color: #00e6a0;
        animation: dotBlink 1.2s infinite ease-in-out;
      }
      .fx-marker.active .fx-dot::after {
        content: "";
        position: absolute;
        inset: -7px;
        border: 1px solid #00e6a0;
        border-radius: 50%;
        animation: fxPulse 1.8s infinite;
      }
      @keyframes fxPulse {
        0% {
          transform: scale(0.7);
          opacity: 1;
        }
        100% {
          transform: scale(2);
          opacity: 0;
        }
      }
      @keyframes dotBlink {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
          box-shadow:
            0 0 0 5px rgba(0, 230, 160, 0.14),
            0 0 15px rgba(0, 230, 160, 0.9);
        }
        50% {
          opacity: 0.65;
          transform: scale(0.9);
          box-shadow:
            0 0 0 9px rgba(0, 230, 160, 0.25),
            0 0 25px rgba(0, 230, 160, 1);
        }
      }

      /* ============================================================
         LONDON → name + time stacked ABOVE the dot
         FRANKFURT → name + time stacked BELOW the dot
         ============================================================ */

      /* --- LONDON --- */
      #fx-marker-london {
        z-index: 5;
      }
      #fx-marker-london .fx-dot {
        order: 2; /* dot moves below the text block */
        margin-top: 4px;
      }
      #fx-marker-london .fx-marker-name {
        order: 1; /* name comes first (top) */
        position: static;
        margin: 0;
        line-height: 1.2;
        font-size: 10px;
        width: auto;
        text-align: center;
      }
      #fx-marker-london .fx-marker-time {
        order: 1; /* time right under the name, still above dot */
        position: static;
        margin: 1px 0 0;
        line-height: 1.2;
        font-size: 9px;
        text-align: center;
      }

      /* --- FRANKFURT --- */
      #fx-marker-frankfurt {
        z-index: 5;
      }
      #fx-marker-frankfurt .fx-dot {
        order: 1; /* dot comes first (top) */
        margin-bottom: 4px;
      }
      #fx-marker-frankfurt .fx-marker-name {
        order: 2; /* name below the dot */
        position: static;
        margin: 0;
        line-height: 1.2;
        font-size: 10px;
        width: auto;
        text-align: center;
      }
      #fx-marker-frankfurt .fx-marker-time {
        order: 3; /* time under the name */
        position: static;
        margin: 1px 0 0;
        line-height: 1.2;
        font-size: 9px;
        text-align: center;
      }

      /* ===== SESSION CARDS ===== */
      .fx-sessions {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 15px;
      }

      /* Card Base */
      .fx-card {
        position: relative;
        min-height: 77px;
        padding: 12px 14px;
        border-radius: 11px;
        background: #182438;
        border: 1px solid transparent;
        transition:
          background 0.3s ease,
          border-color 0.3s ease;
        overflow: hidden;
        isolation: isolate;
        z-index: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      /* Card Content wrapper */
      .fx-card-inner {
        position: relative;
        z-index: 2;
      }

      /* ACTIVE CARD ANIMATION - The "Glowing Ring" technique */
      .fx-card.active {
        background: #172a35;
        border-color: transparent;
        box-shadow: inset 0 2px 0 #00dfa0;
      }

      .fx-card.active::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1.5px;
        background: linear-gradient(
          180deg,
          #00e6a0,
          transparent 40%,
          transparent 60%,
          #00e6a0
        );
        background-size: 100% 200%;
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation: revolveBorder 3s linear infinite;
        pointer-events: none;
        z-index: 1;
      }

      @keyframes revolveBorder {
        0% {
          background-position: 50% 0%;
        }
        100% {
          background-position: 50% 200%;
        }
      }

      .fx-card-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }
      .fx-card strong {
        font-size: 14px;
        color: #f5f7fa;
        font-weight: 700;
      }
      .fx-card p {
        margin: 0;
        color: #9aa9bd;
        font-size: 13px;
        white-space: nowrap;
      }
      .fx-card.active p {
        color: #00e6a0;
      }

      .fx-status {
        font-size: 8.5px;
        letter-spacing: 0.5px;
        color: #8291a6;
        font-weight: 700;
        white-space: nowrap;
      }
      .fx-card.active .fx-status {
        color: #00e6a0;
      }

      /* ===== FOOTER ===== */
      .fx-footer {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 22px;
        font-size: 12px;
        color: #9aa9bd;
      }
      .fx-live-dot {
        height: 8px;
        width: 8px;
        border-radius: 50%;
        background: #00dfa0;
        flex-shrink: 0;
      }

      /* ===== DESKTOP ===== */
      @media (min-width: 1000px) {
        .fx-widget {
          padding: 30px 30px 25px;
        }
        .fx-map {
          margin-top: 25px;
          margin-bottom: 18px;
        }
        .fx-marker-name {
          font-size: 11px;
        }
        .fx-marker-time {
          font-size: 10px;
        }
        .fx-card {
          min-height: 82px;
          padding: 14px 16px;
        }
        .fx-card strong {
          font-size: 15px;
        }
        .fx-card p {
          font-size: 14px;
        }
        #fx-marker-london .fx-marker-name,
        #fx-marker-frankfurt .fx-marker-name {
          font-size: 11px;
        }
        #fx-marker-london .fx-marker-time,
        #fx-marker-frankfurt .fx-marker-time {
          font-size: 10px;
        }
      }

      /* ===== TABLET ===== */
      @media (max-width: 850px) {
        .fx-sessions {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        #fx-marker-london .fx-marker-name,
        #fx-marker-frankfurt .fx-marker-name {
          font-size: 9px;
        }
        #fx-marker-london .fx-marker-time,
        #fx-marker-frankfurt .fx-marker-time {
          font-size: 8px;
        }
      }

      @media (max-width: 700px) {
        .fx-widget {
          padding: 22px 17px;
        }
        .fx-map {
          margin-top: 23px;
        }
        .fx-marker-name {
          font-size: 9px;
        }
        .fx-marker-time {
          font-size: 8px;
        }
      }

      /* ===== MOBILE ===== */
      @media (max-width: 480px) {
        .fx-widget {
          padding: 19px 13px;
          border-radius: 11px;
        }
        .fx-header {
          align-items: flex-start;
          flex-direction: column;
        }
        .fx-header h2 {
          font-size: 20px;
        }
        .fx-clock {
          align-self: flex-end;
          font-size: 11px;
          padding: 6px 10px;
        }
        .fx-map {
          width: 100%;
          aspect-ratio: 1.65 / 1;
          margin: 28px auto 20px;
        }
        .fx-marker {
          min-width: 50px;
        }
        .fx-marker-name {
          font-size: 7.5px;
          margin-bottom: 3px;
        }
        .fx-marker-time {
          font-size: 7.5px;
          margin-top: 3px;
        }
        .fx-dot {
          width: 8px;
          height: 8px;
        }
        .fx-right {
          transform: translate(-85%, -50%);
        }

        .fx-sessions {
          gap: 8px;
        }
        .fx-card {
          padding: 10px 8px;
          min-height: 66px;
          border-radius: 9px;
        }
        .fx-card strong {
          font-size: 12px;
        }
        .fx-card p {
          font-size: 10.5px;
        }
        .fx-status {
          font-size: 7.5px;
        }
        .fx-footer {
          font-size: 10px;
        }
        .fx-card.active::before {
          padding: 1px;
        }

        /* Mobile tweaks for London & Frankfurt stacking */
        #fx-marker-london .fx-marker-name,
        #fx-marker-frankfurt .fx-marker-name {
          font-size: 8px;
        }
        #fx-marker-london .fx-marker-time,
        #fx-marker-frankfurt .fx-marker-time {
          font-size: 7.5px;
        }
        #fx-marker-london .fx-dot,
        #fx-marker-frankfurt .fx-dot {
          margin-top: 3px;
          margin-bottom: 3px;
        }
      }

      @media (max-width: 380px) {
        .fx-card-heading {
          align-items: flex-start;
          flex-direction: column;
          gap: 2px;
        }
        .fx-card {
          min-height: 72px;
        }
        .fx-status {
          margin-top: 2px;
        }
        .fx-map {
          aspect-ratio: 1.5 / 1;
        }
      }
    </style>
  </head>
  <body>
    <section class="fx-widget">
      <div class="fx-header">
        <h2><i class="fa-regular fa-clock"></i> Trading Sessions</h2>
        <div class="fx-clock">
          <i class="fa-regular fa-clock"></i>
          <span id="fx-clock">--:--</span>
          <span class="fx-separator">|</span>
          <span id="fx-timezone">Detecting location...</span>
        </div>
      </div>

      <!-- WORLD MAP -->
      <div class="fx-map">
        <img
          class="fx-world-image"
          src="https://upload.wikimedia.org/wikipedia/commons/0/04/Worldmap_transparent.png"
          alt="World map showing global Forex trading sessions"
        />

        <!-- New York -->
        <div class="fx-marker" id="fx-marker-ny" style="left: 28.5%; top: 30%">
          <span class="fx-marker-name">US New York</span>
          <span class="fx-dot"></span>
          <span class="fx-marker-time" id="fx-local-ny"></span>
        </div>

        <!-- London -->
        <div
          class="fx-marker"
          id="fx-marker-london"
          style="left: 48.5%; top: 23%"
        >
          <span class="fx-marker-name">GB London</span>
          <span class="fx-marker-time" id="fx-local-london"></span>
          <span class="fx-dot"></span>
        </div>

        <!-- Frankfurt (Germany) -->
        <div
          class="fx-marker"
          id="fx-marker-frankfurt"
          style="left: 51.5%; top: 30%"
        >
          <span class="fx-dot"></span>
          <span class="fx-marker-name">DE Frankfurt</span>
          <span class="fx-marker-time" id="fx-local-frankfurt"></span>
        </div>

        <!-- Dubai (UAE) -->
        <div class="fx-marker" id="fx-marker-dubai" style="left: 65%; top: 44%">
          <span class="fx-marker-name">AE Dubai</span>
          <span class="fx-dot"></span>
          <span class="fx-marker-time" id="fx-local-dubai"></span>
        </div>

        <!-- Tokyo -->
        <div
          class="fx-marker fx-right"
          id="fx-marker-tokyo"
          style="left: 89%; top: 30%"
        >
          <span class="fx-marker-name">JP Tokyo</span>
          <span class="fx-dot"></span>
          <span class="fx-marker-time" id="fx-local-tokyo"></span>
        </div>

        <!-- Sydney -->
        <div
          class="fx-marker fx-right"
          id="fx-marker-sydney"
          style="left: 92%; top: 70%"
        >
          <span class="fx-marker-name">AU Sydney</span>
          <span class="fx-dot"></span>
          <span class="fx-marker-time" id="fx-local-sydney"></span>
        </div>
      </div>

      <!-- SESSION CARDS -->
      <div class="fx-sessions">
        <div class="fx-card" id="fx-card-sydney">
          <div class="fx-card-inner">
            <div class="fx-card-heading">
              <strong>AU Sydney</strong>
              <span class="fx-status">CLOSED</span>
            </div>
            <p id="fx-hours-sydney">--</p>
          </div>
        </div>

        <div class="fx-card" id="fx-card-tokyo">
          <div class="fx-card-inner">
            <div class="fx-card-heading">
              <strong>JP Tokyo</strong>
              <span class="fx-status">CLOSED</span>
            </div>
            <p id="fx-hours-tokyo">--</p>
          </div>
        </div>

        <div class="fx-card" id="fx-card-dubai">
          <div class="fx-card-inner">
            <div class="fx-card-heading">
              <strong>AE Dubai</strong>
              <span class="fx-status">CLOSED</span>
            </div>
            <p id="fx-hours-dubai">--</p>
          </div>
        </div>

        <div class="fx-card" id="fx-card-frankfurt">
          <div class="fx-card-inner">
            <div class="fx-card-heading">
              <strong>DE Frankfurt</strong>
              <span class="fx-status">CLOSED</span>
            </div>
            <p id="fx-hours-frankfurt">--</p>
          </div>
        </div>

        <div class="fx-card" id="fx-card-london">
          <div class="fx-card-inner">
            <div class="fx-card-heading">
              <strong>GB London</strong>
              <span class="fx-status">CLOSED</span>
            </div>
            <p id="fx-hours-london">--</p>
          </div>
        </div>

        <div class="fx-card" id="fx-card-ny">
          <div class="fx-card-inner">
            <div class="fx-card-heading">
              <strong>US New York</strong>
              <span class="fx-status">CLOSED</span>
            </div>
            <p id="fx-hours-ny">--</p>
          </div>
        </div>
      </div>

      <div class="fx-footer">
        <span class="fx-live-dot"></span>
        <span id="fx-market-status">Checking market sessions...</span>
      </div>
    </section>

    <script>
      (function () {
        const root = document.querySelector(".fx-widget");

        if (!root || root.dataset.initialized) return;
        root.dataset.initialized = "true";

        // Automatically detect visitor's local timezone
        const USER_TZ =
          Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";

        const markets = [
          { id: "sydney", timezone: "Australia/Sydney", open: 8, close: 17 },
          { id: "tokyo", timezone: "Asia/Tokyo", open: 9, close: 18 },
          { id: "dubai", timezone: "Asia/Dubai", open: 10, close: 19 },
          { id: "frankfurt", timezone: "Europe/Berlin", open: 8, close: 17 },
          { id: "london", timezone: "Europe/London", open: 8, close: 17 },
          { id: "ny", timezone: "America/New_York", open: 8, close: 17 },
        ];

        function getParts(date, timezone) {
          const parts = new Intl.DateTimeFormat("en-US", {
            timeZone: timezone,
            weekday: "short",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            hourCycle: "h23",
          }).formatToParts(date);

          const result = {};
          parts.forEach((p) => (result[p.type] = p.value));

          if (result.hour === "24") result.hour = "00";

          return result;
        }

        function formatTime(date, timezone) {
          return new Intl.DateTimeFormat("en-IN", {
            timeZone: timezone,
            hour: "2-digit",
            minute: "2-digit",
            hour12: true,
          }).format(date);
        }

        function update() {
          const now = new Date();

          // Visitor's local live clock
          const clock = root.querySelector("#fx-clock");
          const timezoneLabel = root.querySelector("#fx-timezone");

          if (clock) {
            clock.textContent = new Intl.DateTimeFormat("en-IN", {
              timeZone: USER_TZ,
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit",
              hour12: true,
            }).format(now);
          }

          if (timezoneLabel) {
            const zone = new Intl.DateTimeFormat("en-US", {
              timeZone: USER_TZ,
              timeZoneName: "short",
            }).formatToParts(now);

            timezoneLabel.textContent =
              zone.find((p) => p.type === "timeZoneName")?.value || USER_TZ;
          }

          let activeCount = 0;

          markets.forEach((market) => {
            const local = getParts(now, market.timezone);

            const currentMinutes =
              Number(local.hour) * 60 + Number(local.minute);

            const opening = market.open * 60;
            const closing = market.close * 60;

            // A session is live only when both conditions are true.
            const active =
              currentMinutes >= opening && currentMinutes < closing;

            if (active) activeCount++;

            // Update map marker
            const marker = root.querySelector("#fx-marker-" + market.id);

            if (marker) {
              marker.classList.toggle("active", active);

              const markerTime = root.querySelector("#fx-local-" + market.id);

              if (markerTime) {
                markerTime.textContent = formatTime(now, market.timezone);
              }
            }

            // Update session card
            const card = root.querySelector("#fx-card-" + market.id);

            if (card) {
              card.classList.toggle("active", active);

              const status = card.querySelector(".fx-status");

              if (status) {
                status.textContent = active ? "LIVE NOW" : "CLOSED";
              }

              // Calculate session timings in visitor's local timezone.
              const start = getSessionTime(local, market, market.open);

              const end = getSessionTime(local, market, market.close);

              const hours = root.querySelector("#fx-hours-" + market.id);

              if (hours) {
                hours.textContent =
                  formatTime(start, USER_TZ) + " - " + formatTime(end, USER_TZ);
              }
            }
          });

          // Footer status — no weekend restriction.
          const footer = root.querySelector("#fx-market-status");

          if (footer) {
            if (activeCount > 0) {
              footer.textContent =
                activeCount +
                (activeCount === 1
                  ? " Trading session currently live"
                  : " Trading sessions currently live");
            } else {
              footer.textContent = "Between major trading sessions";
            }
          }
        }

        // Convert local market hours to a real date.
        function getSessionTime(local, market, hour) {
          const desired = Date.UTC(
            Number(local.year),
            Number(local.month) - 1,
            Number(local.day),
            hour,
          );

          let guess = desired;

          for (let i = 0; i < 5; i++) {
            const p = getParts(new Date(guess), market.timezone);

            const represented = Date.UTC(
              Number(p.year),
              Number(p.month) - 1,
              Number(p.day),
              Number(p.hour),
              Number(p.minute),
            );

            guess += desired - represented;
          }

          return new Date(guess);
        }

        update();

        // Refresh every second.
        setInterval(update, 1000);
      })();
    </script>
  </body>
</html>
