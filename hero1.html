<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Become the Trader · Structured Process</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600;1,700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      /* =========================================
         NEW COLOR PALETTE (as requested)
      ========================================= */
      :root {
        --black: #03070a;
        --black-soft: #081116;
        --cyan: #00d9ff;
        --white: #f5f7f8;
        --muted: #8b9aa3;
        --border: rgba(255, 255, 255, 0.1);
      }

      body {
        background: var(--black);
        color: var(--white);
        font-family: "DM Sans", Inter, sans-serif;
        overflow-x: hidden;
      }

      /* =========================================
        MAIN SECTION
      ========================================= */

      .guarantee-section {
        position: relative;
        width: 100%;
        background: var(--black);
        padding-top: 162px;
        padding-bottom: 0;
      }

      /* =========================================
        CONTENT
      ========================================= */

      .guarantee-content {
        position: relative;
        z-index: 5;
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
        text-align: center;
      }

      /* Eyebrow – now using cyan */
      .eyebrow {
        color: #b8ff2c;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-bottom: 38px;
        text-shadow: 0 0 20px rgba(0, 217, 255, 0.25);
      }

      /* =========================================
        HEADING
      ========================================= */

      .main-title {
        max-width: 1104px;
        margin: 0 auto;
        color: #ffffff;
        font-size: 55px;
        line-height: 1.1;
        letter-spacing: -2.5px;
        font-weight: 600;
      }

      /* .main-title .guarantee {
        font-family: "Playfair Display", serif;
        font-style: italic;
        font-weight: 600;
        color: var(--white);
        letter-spacing: -2px;
      } */

      /* Gold/cyan gradient replaced with a refined silver-cyan shimmer */
      .main-title .gold-text {
        display: inline-block;
        background: linear-gradient(
          180deg,
          #ffffff 0%,
          #c9f0ff 35%,
          #00d9ff 75%,
          #0077a3 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 800;
      }

      /* =========================================
        DIVIDER – subtle cyan glow
      ========================================= */

      .gold-line {
        width: 390px;
        max-width: 60%;
        height: 5px;
        margin: 38px auto 28px;
        background: linear-gradient(
          90deg,
          transparent,
          #007a99 15%,
          #00d9ff 50%,
          #007a99 85%,
          transparent
        );
        box-shadow: 0 0 18px rgba(0, 217, 255, 0.35);
      }

      /* =========================================
        SUBTEXT – clean, using muted / cyan accent
      ========================================= */

      .subtext {
        font-size: 21px;
        line-height: 1.5;
        color: var(--muted);
        font-weight: 500;
        max-width: 780px;
        margin: 0 auto;
      }

      .subtext strong {
        color: var(--cyan);
        font-weight: 800;
      }

      /* =========================================
        VIDEO SCROLL AREA
      ========================================= */

      .video-scroll-area {
        position: relative;
        width: 100%;
        height: 115vh;
        margin-top: 48px;
      }

      /* =========================================
        VIDEO WRAPPER (sticky + growing)
      ========================================= */

      .video-wrapper {
        position: sticky;
        top: 12vh;

        /* width is controlled by JS via --video-width, set in px */
        width: var(--video-width, 300px);
        height: 520px;

        margin: 0 auto;

        overflow: hidden;

        border-radius: var(--video-radius, 15px);

        background: var(--black-soft);

        box-shadow:
          0 20px 80px rgba(0, 0, 0, 0.85),
          0 0 0 1px var(--border);

        transition:
          width 0.08s linear,
          border-radius 0.08s linear;
      }

      /* =========================================
        THUMBNAIL
      ========================================= */

      .video-thumbnail {
        position: absolute;
        inset: 0;

        background-image:
          linear-gradient(90deg, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.05)),
          url("https://images.pexels.com/photos/27051702/pexels-photo-27051702.jpeg");

        background-size: cover;
        background-position: center;

        cursor: pointer;

        transition:
          opacity 0.45s ease,
          transform 0.7s ease;
      }

      .video-thumbnail:hover {
        transform: scale(1.025);
      }

      .video-thumbnail::after {
        content: "";
        position: absolute;
        inset: 0;

        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.15),
          rgba(0, 0, 0, 0.45)
        );
      }

      /* =========================================
        PLAY BUTTON – cyan accent
      ========================================= */

      .play-button {
        position: absolute;
        z-index: 5;

        top: 50%;
        left: 50%;

        width: 82px;
        height: 82px;

        transform: translate(-50%, -50%);

        border: 1px solid rgba(0, 217, 255, 0.65);
        border-radius: 50%;

        background: rgba(3, 7, 10, 0.55);
        backdrop-filter: blur(10px);

        display: flex;
        align-items: center;
        justify-content: center;

        transition:
          transform 0.3s ease,
          background 0.3s ease,
          border-color 0.3s ease;
      }

      .play-button::after {
        content: "";

        margin-left: 6px;

        width: 0;
        height: 0;

        border-top: 12px solid transparent;
        border-bottom: 12px solid transparent;
        border-left: 18px solid var(--cyan);
      }

      .video-thumbnail:hover .play-button {
        transform: translate(-50%, -50%) scale(1.1);
        background: rgba(0, 217, 255, 0.2);
        border-color: var(--cyan);
      }

      /* =========================================
        VIDEO ELEMENT
      ========================================= */

      .video-element {
        width: 100%;
        height: 100%;

        object-fit: cover;

        display: block;

        opacity: 0;

        transition: opacity 0.5s ease;
      }

      .video-wrapper.playing .video-element {
        opacity: 1;
      }

      .video-wrapper.playing .video-thumbnail {
        opacity: 0;
        pointer-events: none;
      }

      /* =========================================
        RESPONSIVE
      ========================================= */

      @media (max-width: 1100px) {
        .guarantee-section {
          padding-top: 60px;
        }

        .main-title {
          font-size: clamp(40px, 5.5vw, 60px);
        }

        .video-wrapper {
          height: 480px;
        }
      }

      @media (max-width: 768px) {
        .guarantee-section {
          padding-top: 50px;
        }

        .guarantee-content {
          width: calc(100% - 30px);
        }

        .eyebrow {
          font-size: 12px;
          letter-spacing: 3px;
          margin-bottom: 25px;
        }

        .main-title {
          font-size: clamp(34px, 9vw, 52px);
          line-height: 1.02;
          letter-spacing: -2px;
        }

        .main-title .guarantee {
          letter-spacing: -1px;
        }

        .gold-line {
          margin-top: 28px;
          margin-bottom: 22px;
          height: 4px;
        }

        .subtext {
          font-size: 17px;
        }

        .video-scroll-area {
          height: 100vh;
          margin-top: 40px;
        }

        .video-wrapper {
          top: 10vh;
          height: 430px;
          border-radius: 12px;
        }

        .play-button {
          width: 68px;
          height: 68px;
        }

        .play-button::after {
          border-top-width: 10px;
          border-bottom-width: 10px;
          border-left-width: 15px;
        }
      }

      @media (max-width: 480px) {
        .main-title {
          font-size: 32px;
        }

        .video-wrapper {
          height: 330px;
        }

        .subtext {
          font-size: 15px;
        }
      }
    </style>
  </head>

  <body>
    <section class="guarantee-section">
      <div class="guarantee-content">
        <!-- EYEBROW -->
        <div class="eyebrow">TRADING WITH STRUCTURE</div>

        <!-- HEADING -->
        <h1 class="main-title">
          Become the Trader <br />
          <span class="gold-text">You Know You Can Be</span>

          <!-- <br />
          <span class="main-title"></span> -->
        </h1>

        <!-- DIVIDER -->
        <div class="gold-line"></div>

        <!-- SUBTEXT -->
        <p class="subtext">
          Build a structured trading process, understand your edge, manage risk
          and learn how to execute with consistency.
        </p>
      </div>

      <!-- SCROLL VIDEO -->
      <div class="video-scroll-area">
        <div class="video-wrapper" id="videoWrapper">
          <!-- VIDEO -->
          <video
            id="mainVideo"
            class="video-element"
            playsinline
            preload="metadata"
            controls
          >
            <source
              src="https://www.pexels.com/download/video/35606120/"
              type="video/mp4"
            />
          </video>

          <!-- THUMBNAIL -->
          <div class="video-thumbnail" id="videoThumbnail">
            <div class="play-button"></div>
          </div>
        </div>
      </div>
    </section>

    <script>
      /* =========================================
         VIDEO PLAY
      ========================================= */

      const videoWrapper = document.getElementById("videoWrapper");
      const video = document.getElementById("mainVideo");
      const thumbnail = document.getElementById("videoThumbnail");

      thumbnail.addEventListener("click", function () {
        videoWrapper.classList.add("playing");
        video.play();
      });

      /* =========================================
         SCROLL VIDEO GROW EFFECT
         – grows from 550px to full width (capped)
      ========================================= */

      const scrollArea = document.querySelector(".video-scroll-area");

      function updateVideoSize() {
        const rect = scrollArea.getBoundingClientRect();
        const viewportHeight = window.innerHeight;

        // progress from 0 → 1 as the section scrolls into view
        let progress = (viewportHeight - rect.top) / (viewportHeight * 0.95);
        progress = Math.max(0, Math.min(1, progress));

        // --- width calculation ---
        const startWidthPx = 550;

        const containerWidth = scrollArea.clientWidth;

        const maxAllowed = Math.min(
          containerWidth,
          900,
          window.innerWidth * 0.92,
        );

        const currentWidthPx =
          startWidthPx + (maxAllowed - startWidthPx) * progress;

        // Border radius: 15px → 0px
        const radius = 15 - 15 * progress;

        videoWrapper.style.setProperty("--video-width", currentWidthPx + "px");
        videoWrapper.style.setProperty("--video-radius", radius + "px");
      }

      /* =========================================
         PERFORMANCE (throttled with rAF)
      ========================================= */

      let ticking = false;

      window.addEventListener("scroll", function () {
        if (!ticking) {
          window.requestAnimationFrame(function () {
            updateVideoSize();
            ticking = false;
          });
          ticking = true;
        }
      });

      window.addEventListener("resize", function () {
        updateVideoSize();
      });

      /* Initial call */
      updateVideoSize();
    </script>
  </body>
</html>
